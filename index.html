<!-- Force update checker -->
<script>
  // Cek versi tersimpan di localStorage
  const CURRENT_VERSION = '2.5.0'; // ⬅️ Naikkan setiap kali update kode
  const savedVersion = localStorage.getItem('awb_gh1_version');
  
  if (savedVersion && savedVersion !== CURRENT_VERSION) {
    console.log('🔄 Versi berubah:', savedVersion, '→', CURRENT_VERSION);
    // Clear cache storage & session
    localStorage.setItem('awb_gh1_version', CURRENT_VERSION);
    
    // Force reload tanpa cache
    if ('caches' in window) {
      caches.keys().then(keys => {
        keys.forEach(key => caches.delete(key));
        console.log('🗑️ Semua cache dihapus');
      });
    }
  } else if (!savedVersion) {
    localStorage.setItem('awb_gh1_version', CURRENT_VERSION);
  }
</script>
